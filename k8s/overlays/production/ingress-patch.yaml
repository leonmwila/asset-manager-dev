apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oemis-odoo
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: oemis.grz.gov.zm
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oemis-odoo
                port:
                  number: 8069
