apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oemis-postgres
spec:
  serviceName: oemis-postgres
  replicas: 1
  selector:
    matchLabels:
      app: oemis-postgres
  template:
    metadata:
      labels:
        app: oemis-postgres
    spec:
      containers:
        - name: oemis-postgres
          image: postgres:15
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: oemis-postgres-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: oemis-postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER"
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER"
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: oemis-postgres-data
          persistentVolumeClaim:
            claimName: oemis-postgres-data
